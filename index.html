<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700 text-center">
        <h1 id="username" class="text-2xl font-bold mb-2">Йоу, загрузка... 🚀</h1>
        <p class="text-gray-400 text-sm mb-6">Твой баланс: <span id="balance" class="text-green-400 font-bold">1000</span> коинов</p>

        <div class="space-y-3">
            <button onclick="playGame('cases')" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition shadow-lg active:scale-95">
                📦 Открыть кейс
            </button>
            <button onclick="playGame('mines')" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded-xl transition shadow-lg active:scale-95">
                💣 Сапер (Mines)
            </button>
            <button onclick="playGame('plinko')" class="w-full bg-amber-600 hover:bg-amber-500 font-semibold py-3 rounded-xl transition shadow-lg active:scale-95">
                ⚪ Плинко (Plinko)
            </button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById("username").innerText = `Привет, ${user.first_name}! 👋`;
        } else {
            document.getElementById("username").innerText = `Привет, Бро! (GitHub Pages) 📱`;
        }

        function playGame(mode) {
            alert(`Режим "${mode}" в разработке, скоро навалим код! 💸`);
        }
    </script>
</body>
</html>
